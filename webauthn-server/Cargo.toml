[package]
name = "webauthn-server"
version = "0.1.0"
edition = "2021"
description = "WebAuthn server companion to Chapter 41"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["fs", "cors"] }